stages:
  - build
  - release

image: docker:dind

services:
  - docker:dind

variables:
  DOCKER_REGISTRY: "epicsoft/tomcat"

before_script:
  - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
  - docker login -u="$DOCKER_HUB_USER" -p="$DOCKER_HUB_TOKEN"

after_script:
  - docker logout $CI_REGISTRY
  - docker logout

.scriptBuild: &scriptBuild
  - echo "Build Tomcat Docker image with version '${VERSION}'"
  - docker build --pull --no-cache -t ${CI_REGISTRY_IMAGE}:${VERSION} . --build-arg IMAGE_TAG=${VERSION} --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
  - docker push ${CI_REGISTRY_IMAGE}:${VERSION}
  - docker tag ${CI_REGISTRY_IMAGE}:${VERSION} ${DOCKER_REGISTRY}:${VERSION}
  - docker push ${DOCKER_REGISTRY}:${VERSION}
  - docker run --rm ${CI_REGISTRY_IMAGE}:${VERSION} /usr/local/tomcat/bin/version.sh

tomcatLatest:
  stage: build
  variables:
    VERSION: "latest"
  script: *scriptBuild

tomcat11.0-jre21:
  stage: build
  variables:
    VERSION: "11.0-jre21"
  script: *scriptBuild

tomcat10-jre21:
  stage: build
  variables:
    VERSION: "10-jre21"
  script: *scriptBuild

tomcat10-jre17:
  stage: build
  variables:
    VERSION: "10-jre17"
  script: *scriptBuild

tomcat10-jre11:
  stage: build
  variables:
    VERSION: "10-jre11"
  script: *scriptBuild

tomcat9-jre21:
  stage: build
  variables:
    VERSION: "9-jre21"
  script: *scriptBuild

tomcat9-jre17:
  stage: build
  variables:
    VERSION: "9-jre17"
  script: *scriptBuild

tomcat9-jre11:
  stage: build
  variables:
    VERSION: "9-jre11"
  script: *scriptBuild

tomcat9.0-jre11:
  stage: build
  variables:
    VERSION: "9.0-jre11"
  script: *scriptBuild

uploadReadme:
  stage: release
  script:
    - docker run --rm -v $PWD:/workspace
      -e DOCKERHUB_USERNAME=${DOCKER_HUB_USER}
      -e DOCKERHUB_PASSWORD=${DOCKER_HUB_TOKEN}
      -e DOCKERHUB_REPOSITORY=${DOCKER_REGISTRY}
      -e SHORT_DESCRIPTION="Automatically passes Docker environments to the application, based on official Tomcat image"
      -e README_FILEPATH='/workspace/README.md'
        peterevans/dockerhub-description:latest
