stages:
  - test
  - build
  - release

image: docker:dind

services:
  - docker:dind

variables:
  DOCKER_REGISTRY: "epicsoft/tomcat"

# The tokens go in over stdin: '-p' would put them in the process list of the runner.
before_script:
  - echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin "$CI_REGISTRY"
  - echo "$DOCKER_HUB_TOKEN" | docker login -u "$DOCKER_HUB_USER" --password-stdin

after_script:
  - docker logout $CI_REGISTRY
  - docker logout

# Publishing happens from the default branch and from the weekly schedule, nowhere else.
# Without this every push to every branch built all tags, pushed them to docker hub and
# overwrote the description there - a branch that was never meant to be released included.
# The test stage has no rule and runs everywhere, which is the point of it.
.rulesPublish: &rulesPublish
  - if: $CI_PIPELINE_SOURCE == "schedule"
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# One template for all published tags: a version job is its name and its VERSION, nothing
# else. A job that carries its own copy of the steps is a job that can be forgotten when
# they change - or one that is copied without the rules and publishes from any branch.
#
# 'retry' covers the pull of the official image and the two pushes, which fail every now
# and then for reasons that have nothing to do with this repository. The test job has no
# retry on purpose: a red test is a result, not a hiccup, and repeating it three times
# only hides how often it is red.
.build:
  stage: build
  retry: 2
  rules: *rulesPublish
  script:
    # A tag names the versions in the image, and it moves - '11.0-jre21' is a different
    # Tomcat and a different JRE every few weeks. What the official image reports about
    # itself is read out here and written into the labels, together with the digest it was
    # pulled under, so a published tag can be traced back to what actually went into it.
    - echo "Read the versions of the official image 'tomcat:${VERSION}'"
    - docker pull tomcat:${VERSION}
    - BASE_INFO=$(docker run --rm tomcat:${VERSION} /usr/local/tomcat/bin/version.sh)
    - TOMCAT_VERSION=$(echo "${BASE_INFO}" | sed -n 's/^Server number:[[:space:]]*//p')
    - JAVA_VERSION=$(echo "${BASE_INFO}" | sed -n 's/^JVM Version:[[:space:]]*//p')
    - BASE_DIGEST=$(docker image inspect -f '{{if .RepoDigests}}{{index .RepoDigests 0}}{{end}}' tomcat:${VERSION} | cut -d@ -f2)
    - echo "Tomcat '${TOMCAT_VERSION}' on JRE '${JAVA_VERSION}'"
    - echo "Build Tomcat Docker image with version '${VERSION}'"
    - docker build --pull --no-cache -t ${CI_REGISTRY_IMAGE}:${VERSION} . --build-arg IMAGE_TAG=${VERSION} --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') --build-arg VCS_REF=${CI_COMMIT_SHORT_SHA} --build-arg TOMCAT_VERSION=${TOMCAT_VERSION} --build-arg JAVA_VERSION=${JAVA_VERSION} --build-arg BASE_DIGEST=${BASE_DIGEST}
    # Tested before it is pushed, not after: a broken image that is already published
    # cannot be taken back, and 'latest' is what a 'docker pull' without a tag gets. The
    # second run covers what this image adds to the official one, on every tag.
    - echo "Test Tomcat Docker image with version '${VERSION}'"
    - docker run --rm ${CI_REGISTRY_IMAGE}:${VERSION} /usr/local/tomcat/bin/version.sh
    - docker run --rm -e APP_CI_SMOKE=ok ${CI_REGISTRY_IMAGE}:${VERSION} bash -c 'source /usr/local/tomcat/bin/setenv.sh; echo "${CATALINA_OPTS}"' /usr/local/tomcat/bin/catalina.sh | grep -F "app.ci.smoke='ok'"
    - echo "Push Tomcat Docker image with version '${VERSION}'"
    - docker push ${CI_REGISTRY_IMAGE}:${VERSION}
    - docker tag ${CI_REGISTRY_IMAGE}:${VERSION} ${DOCKER_REGISTRY}:${VERSION}
    - docker push ${DOCKER_REGISTRY}:${VERSION}

# the local test environment, run against 'tomcat:latest'. it builds the image itself, so
# it needs nothing from the build stage - and because it runs before it, a red test keeps
# the weekly build from publishing
test:
  stage: test
  script:
    - apk add --no-cache bash
    - bash test/test.sh default

tomcatLatest:
  extends: .build
  variables:
    VERSION: "latest"

